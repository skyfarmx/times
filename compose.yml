#version: '3.9'

services:
  web:
    build: .
    command: bash -c "source /myprojects/myprojectenv/bin/activate && python manage.py runserver 0.0.0.0:8000"
    restart: always
    image: news_time
    container_name: murad
    volumes:
      - static_volume:/myprojects/static/
      - media_volume:/myprojects/media/
    ports:
      - "8000:8000"
   

volumes:
 static_volume:
 media_volume: